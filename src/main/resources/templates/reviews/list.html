<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>评审管理</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="page-header">
            <h2>评审管理</h2>
        </div>
        <div class="card-list">
            <div th:if="${#lists.isEmpty(reviews)}" class="empty-state">
                <p>暂无评审记录</p>
            </div>
            <div th:each="review : ${reviews}" class="card">
                <div class="card-header">
                    <h3>
                        <a th:href="@{/reviews/{id}(id=${review.id})}" th:text="${review.proposal.title}"></a>
                    </h3>
                    <span th:class="'status-badge status-' + ${review.result}" th:text="${review.result}"></span>
                </div>
                <div class="card-body">
                    <p th:if="${review.score != null}">评分：<strong th:text="${review.score}"></strong>/100</p>
                    <p class="card-desc" th:text="${#strings.abbreviate(review.comment, 80)}"></p>
                    <div class="card-meta">
                        <span>评审人：<span th:text="${review.reviewer.displayName}"></span></span>
                        <span th:text="${#temporals.format(review.createdAt, 'yyyy-MM-dd')}"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
