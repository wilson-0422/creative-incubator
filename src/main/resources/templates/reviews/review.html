<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>发起评审</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="page-header">
            <h2>发起评审</h2>
            <a th:href="@{/proposals/{id}(id=${proposal.id})}" class="btn btn-secondary">返回提报</a>
        </div>
        <div class="detail-card" style="margin-bottom: 24px;">
            <div class="detail-header">
                <h3 th:text="${proposal.title}"></h3>
                <span th:class="'status-badge status-' + ${proposal.status}" th:text="${proposal.status}"></span>
            </div>
            <div class="detail-body">
                <div class="detail-row">
                    <label>提报部门：</label>
                    <span th:text="${proposal.department}"></span>
                </div>
                <div class="detail-row full">
                    <label>创意描述：</label>
                    <div class="detail-content" th:text="${proposal.description}"></div>
                </div>
            </div>
        </div>
        <div class="form-card">
            <h3>填写评审意见</h3>
            <form th:action="@{/reviews/proposal/{proposalId}(proposalId=${proposal.id})}" th:object="${review}" method="post">
                <div class="form-group">
                    <label for="score">评分（0-100）</label>
                    <input type="number" id="score" th:field="*{score}" min="0" max="100" required placeholder="请输入评分">
                </div>
                <div class="form-group">
                    <label for="comment">评审意见</label>
                    <textarea id="comment" th:field="*{comment}" rows="6" required placeholder="请输入评审意见"></textarea>
                </div>
                <div class="form-group">
                    <label for="result">评审结论</label>
                    <select id="result" th:field="*{result}" required>
                        <option value="">请选择结论</option>
                        <option value="APPROVED">通过</option>
                        <option value="REJECTED">驳回</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">提交评审</button>
                    <a th:href="@{/proposals/{id}(id=${proposal.id})}" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
