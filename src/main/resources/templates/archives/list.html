<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>项目归档</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="page-header">
            <h2>项目归档</h2>
        </div>
        <div class="card-list">
            <div th:if="${#lists.isEmpty(archives)}" class="empty-state">
                <p>暂无归档项目</p>
            </div>
            <div th:each="archive : ${archives}" class="card">
                <div class="card-header">
                    <h3><a th:href="@{/archives/{id}(id=${archive.id})}" th:text="${archive.name}"></a></h3>
                    <span class="status-badge status-ARCHIVED">已归档</span>
                </div>
                <div class="card-body">
                    <p class="card-desc" th:text="${#strings.abbreviate(archive.summary, 100)}"></p>
                    <div class="card-meta">
                        <span th:text="${archive.department}"></span>
                        <span th:text="${#temporals.format(archive.archivedAt, 'yyyy-MM-dd')}"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
