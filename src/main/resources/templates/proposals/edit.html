<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>编辑提报</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="page-header">
            <h2>编辑创意提报</h2>
            <a th:href="@{/proposals/{id}(id=${proposal.id})}" class="btn btn-secondary">返回详情</a>
        </div>
        <div class="form-card">
            <form th:action="@{/proposals/{id}(id=${proposal.id})}" th:object="${proposal}" method="post">
                <div class="form-group">
                    <label for="title">创意标题</label>
                    <input type="text" id="title" th:field="*{title}" required>
                </div>
                <div class="form-group">
                    <label for="category">创意类别</label>
                    <select id="category" th:field="*{category}" required>
                        <option value="NEW_PRODUCT">新品立项</option>
                        <option value="PROCESS_IMPROVEMENT">流程优化</option>
                        <option value="MARKETING">营销创意</option>
                        <option value="TECHNOLOGY">技术创新</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="description">创意描述</label>
                    <textarea id="description" th:field="*{description}" rows="8" required></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a th:href="@{/proposals/{id}(id=${proposal.id})}" class="btn btn-secondary">取消</a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
