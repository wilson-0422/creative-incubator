<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <title>注册</title>
</head>
<body>
    <main layout:fragment="content">
        <div class="auth-container">
            <div class="auth-card">
                <h2>注册</h2>
                <div th:if="${error}" class="alert alert-error">
                    <span th:text="${error}"></span>
                </div>
                <form th:action="@{/auth/register}" th:object="${user}" method="post">
                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" th:field="*{username}" required placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" th:field="*{password}" required placeholder="请输入密码">
                    </div>
                    <div class="form-group">
                        <label for="displayName">姓名</label>
                        <input type="text" id="displayName" th:field="*{displayName}" required placeholder="请输入姓名">
                    </div>
                    <div class="form-group">
                        <label for="department">部门</label>
                        <select id="department" th:field="*{department}" required>
                            <option value="">请选择部门</option>
                            <option value="产品研发部">产品研发部</option>
                            <option value="市场营销部">市场营销部</option>
                            <option value="技术架构部">技术架构部</option>
                            <option value="用户体验部">用户体验部</option>
                            <option value="数据分析部">数据分析部</option>
                            <option value="运营管理部">运营管理部</option>
                            <option value="信息技术部">信息技术部</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="email">邮箱</label>
                        <input type="email" id="email" th:field="*{email}" placeholder="请输入邮箱">
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">注册</button>
                </form>
                <div class="auth-footer">
                    <p>已有账号？<a th:href="@{/auth/login}">立即登录</a></p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
